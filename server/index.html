<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Samarth Enterprises</title>
    <link rel="icon" href="images/samarth.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="samarth.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo-section {
            margin-bottom: 30px;
        }

        .logo-section img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
        }

        .logo-section h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .logo-section p {
            color: #666;
            font-size: 14px;
        }

        .divider {
            height: 2px;
            background: #e0e0e0;
            margin: 30px 0;
        }

        .login-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .login-button {
            padding: 20px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
        }

        .admin-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            text-decoration: none;
        }

        .admin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .user-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            text-decoration: none;
        }

        .user-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
        }

        .home-link {
            margin-top: 30px;
            text-align: center;
        }

        .home-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .home-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .login-container {
                padding: 30px 20px;
            }

            .login-options {
                grid-template-columns: 1fr;
            }

            .logo-section h1 {
                font-size: 22px;
            }

            .login-button {
                font-size: 14px;
                padding: 15px 20px;
            }
        }

        .icon {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <img src="images/samarth.jpg" alt="Samarth Enterprises logo">
            <h1>Samarth Enterprises</h1>
            <p>Labour & Security Services</p>
        </div>

        <div class="divider"></div>

        <p style="color: #666; margin: 20px 0;">Please select your login type</p>

        <div class="login-options">
            <a href="admin-login.html" class="login-button admin-btn">
                <i class="fa-solid fa-lock icon"></i>
                <span>Admin Login</span>
            </a>
            <a href="login.html" class="login-button user-btn">
                <i class="fa-solid fa-user icon"></i>
                <span>User Login</span>
            </a>
        </div>

        <div class="home-link">
            <a href="samarth.html">← View Website Home</a>
        </div>
    </div>
</body>
</html>
